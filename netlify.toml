# Netlify Configuration for HeatShield AI Frontend

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Single-Page App redirect for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
